services:
  - type: web
    name: reviewlens-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.15.0
      - key: GEMINI_API_KEY
        sync: false          # you type this in the Render dashboard
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: CORS_ORIGINS
        sync: false          # your Vercel URL, e.g. https://reviewlens.vercel.app
